[project]
name = "agentic-research-copilot"
version = "0.1.0"
description = "Agentic Research Copilot with Temporal, LangGraph, Qdrant, and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.5.0",
    "langgraph>=0.0.60",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "qdrant-client>=1.9.1",
    "supabase>=2.5.1",
    "mcp>=0.0.2",
    "tavily-python>=0.3.3",
    "langchain-groq>=0.1.5",
    "structlog>=24.2.0",
    "arxiv>=2.1.0",
    "httpx>=0.27.0",
    "langchain-community>=0.2.0",
    "sentence-transformers>=2.7.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "workflow", "agents", "mcp_servers", "utils"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.0.0"
]
